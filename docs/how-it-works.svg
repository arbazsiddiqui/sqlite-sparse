<svg xmlns="http://www.w3.org/2000/svg" width="980" height="580" viewBox="0 0 980 580" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs>
<rect width="980" height="580" fill="#ffffff"/>
<text x="240" y="28" text-anchor="middle" fill="#222" font-weight="600" font-size="15">INSERT, once per document</text>
<text x="240" y="46" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">runs the model</text>
<text x="730" y="28" text-anchor="middle" fill="#222" font-weight="600" font-size="15">MATCH, every search</text>
<text x="730" y="46" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">no model</text>
<rect x="60" y="64" width="360" height="44" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="240" y="91" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">"Aspirin lowers the risk of heart attack and stroke."</text>
<line x1="240" y1="108" x2="240" y2="130" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="60" y="132" width="360" height="46" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="240" y="150" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">word pieces</text>
<text x="240" y="169" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5">as ##pi ##rin lowers the risk of heart attack and stroke</text>
<line x1="240" y1="178" x2="240" y2="200" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="60" y="202" width="360" height="54" rx="6" fill="#fff7ec" stroke="#b86e00" stroke-width="1.3"/>
<text x="240" y="222" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">encoder from the GGUF, via llama.cpp</text>
<text x="240" y="242" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">one vector per word piece</text>
<line x1="240" y1="256" x2="240" y2="278" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="60" y="280" width="360" height="54" rx="6" fill="#fff7ec" stroke="#b86e00" stroke-width="1.3"/>
<text x="240" y="300" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">scoring head (from the .sprs sidecar)</text>
<text x="240" y="320" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">scores every vocabulary word, keeps the positive ones</text>
<line x1="240" y1="334" x2="240" y2="356" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="60" y="358" width="360" height="88" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="240" y="378" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">157 weighted terms</text>
<text x="240" y="398" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">heart 0.95   stroke 0.92   risk 0.78   reduce 0.70</text>
<text x="240" y="416" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">lower 0.70   strokes 0.68   heartbeat 0.45   attacks 0.42</text>
<text x="178" y="436" text-anchor="middle" fill="#b32d2d" font-weight="600" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">cardiac 0.42   prevents 0.18</text>
<text x="348" y="436" text-anchor="middle" fill="#555" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">... 149 more</text>
<line x1="240" y1="446" x2="240" y2="468" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="60" y="470" width="360" height="84" rx="6" fill="#f3f6fb" stroke="#2f5d9e" stroke-width="1.3"/>
<text x="240" y="490" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">posting lists in the .db, one row per word</text>
<text x="240" y="512" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11">heart    → (doc 1, 0.95) (doc 7, 0.61) ...</text>
<text x="240" y="530" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="11">cardiac  → (doc 1, 0.42) (doc 4, 0.55) ...</text>
<text x="240" y="547" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">one byte per weight</text>
<rect x="550" y="64" width="360" height="44" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="730" y="91" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">"what prevents cardiac arrest"</text>
<line x1="730" y1="108" x2="730" y2="130" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="550" y="132" width="360" height="46" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="730" y="150" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">word pieces</text>
<text x="730" y="169" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">what   prevents   cardiac   arrest</text>
<line x1="730" y1="178" x2="730" y2="200" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="550" y="202" width="360" height="66" rx="6" fill="#f3f6fb" stroke="#2f5d9e" stroke-width="1.3"/>
<text x="730" y="222" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">query weight table in the .db</text>
<text x="730" y="240" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">one learned number per vocabulary word</text>
<text x="730" y="259" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">what 2.77   prevents 6.72   cardiac 6.53   arrest 6.87</text>
<line x1="730" y1="268" x2="730" y2="290" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="550" y="292" width="360" height="100" rx="6" fill="#f3f6fb" stroke="#2f5d9e" stroke-width="1.3"/>
<text x="730" y="312" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">scatter-add</text>
<text x="730" y="330" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">for each query word, walk its posting list and add</text>
<text x="730" y="346" text-anchor="middle" fill="#555" font-weight="normal" font-size="12">query weight × stored weight to each document</text>
<text x="730" y="366" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">prevents  6.72 × 0.18 = 1.18   → doc 1</text>
<text x="730" y="384" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">cardiac   6.53 × 0.42 = 2.78   → doc 1</text>
<line x1="730" y1="392" x2="730" y2="414" stroke="#555" stroke-width="1.3" marker-end="url(#arr)"/>
<rect x="550" y="416" width="360" height="48" rx="6" fill="#ffffff" stroke="#444444" stroke-width="1.3"/>
<text x="730" y="436" text-anchor="middle" fill="#222" font-weight="normal" font-size="13">sort touched documents, return top k</text>
<text x="730" y="456" text-anchor="middle" fill="#222" font-weight="normal" font-family="SFMono-Regular, Menlo, Consolas, monospace" font-size="12">doc 1   score 3.95</text>
<path d="M420,512 C500,512 500,342 548,342" fill="none" stroke="#2f5d9e" stroke-width="1.4" stroke-dasharray="5,4" marker-end="url(#arr)"/>
<text x="485" y="430" text-anchor="middle" fill="#2f5d9e" font-weight="normal" font-size="11">read at search time</text>
</svg>